name: Build and Release Desktop App
on:
  push:
    tags:
      - 'v*' # Trigger only when a new version tag is pushed (e.g., v1.0.1)

jobs:
  build-desktop:
    runs-on: windows-latest
    permissions:
      contents: write   # Required to create GitHub Releases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js (for React frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install .NET MAUI Workloads
      run: dotnet workload install maui-windows

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Install Web Dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Generate Prisma Types
      run: pnpm --filter @hotel-pms/db run db:generate

    - name: Build Web (Next.js Static Export)
      run: pnpm build:desktop
      env:
        NEXT_PUBLIC_IS_DESKTOP: "true"

    - name: Move Web Export to MAUI wwwroot
      shell: powershell
      run: |
        Remove-Item -Recurse -Force ./apps/desktop/LodgeCore.Desktop/wwwroot -ErrorAction Ignore
        Copy-Item -Path ./apps/web/out -Destination ./apps/desktop/LodgeCore.Desktop/wwwroot -Recurse

    - name: Import Permanent Code-Signing Certificate
      id: import_cert
      shell: powershell
      env:
        CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      run: |
        # Decode the permanent PFX from GitHub secret (stripping newlines)
        $base64 = $env:CERTIFICATE_BASE64 -replace '\s',''
        $pfxBytes = [System.Convert]::FromBase64String($base64)
        New-Item -ItemType Directory -Force -Path .\apps\desktop\LodgeCore.Desktop\Certificates | Out-Null
        $pfxPath = "$PWD\apps\desktop\LodgeCore.Desktop\Certificates\LodgeCore.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        # Import into CurrentUser\My store so SignTool can find it by thumbprint
        $secPwd = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -Force -AsPlainText
        $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPwd
        $thumbprint = $cert.Thumbprint
        $subject = $cert.Subject

        Write-Host "Certificate imported. Subject: $subject | Thumbprint: $thumbprint"

        # Write to GITHUB_ENV for subsequent steps
        echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
        echo "CERT_SUBJECT=$subject" >> $env:GITHUB_ENV

        # Parse a Windows-compatible four-part version from the release tag.
        # Accept v1.2.9 and v1.2.9.0, but reject ambiguous/non-numeric tags.
        $tag = "${{ github.ref_name }}"
        if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.BUILD (received: $tag)"
        }
        if ($Matches[4]) {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$($Matches[4])"
        } else {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
        }
        echo "APP_VERSION=$version" >> $env:GITHUB_ENV

        # Sync manifest Publisher AND Version with cert Subject and tag version
        # This ensures the built MSIX filename matches what the .appinstaller declares
        $manifestPath = ".\apps\desktop\LodgeCore.Desktop\Platforms\Windows\Package.appxmanifest"
        [xml]$manifestXml = Get-Content $manifestPath -Raw
        $ns = New-Object System.Xml.XmlNamespaceManager($manifestXml.NameTable)
        $ns.AddNamespace('pkg', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
        $identity = $manifestXml.SelectSingleNode('//pkg:Identity', $ns)
        $identity.SetAttribute('Publisher', $subject)
        $identity.SetAttribute('Version', $version)
        $manifestXml.Save($manifestPath)
        Write-Host "Manifest Publisher updated to: $subject"
        Write-Host "Manifest Version updated to: $version"

    - name: Publish MAUI Windows MSIX
      shell: powershell
      run: |
        dotnet publish apps/desktop/LodgeCore.Desktop `
          -c Release `
          -f net10.0-windows10.0.19041.0 `
          /p:RuntimeIdentifierOverride=win10-x86 `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxPackageSigningEnabled=true `
          "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" `
          "/p:Version=$env:APP_VERSION" `
          "/p:ApplicationVersion=$env:APP_VERSION"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Generate .appinstaller for Auto-Update
      shell: powershell
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $env:APP_VERSION
        $repo = "${{ github.repository }}"

        # Find the built MSIX file
        $msixFile = Get-ChildItem -Path .\apps\desktop\LodgeCore.Desktop\bin -Recurse -Filter "*.msix" |
                    Where-Object { $_.Name -notlike "*Dependencies*" } |
                    Select-Object -First 1
        if (-not $msixFile) {
          Write-Error "No MSIX file found!"
          exit 1
        }
        $msixName = $msixFile.Name
        Write-Host "MSIX: $msixName"

        # The stable URL where this .appinstaller will be hosted (Vercel proxy)
        $appinstallerUrl = "https://hotel-pms-web-nine.vercel.app/api/desktop-update/LodgeCore.appinstaller"
        # Direct download URL for the MSIX on GitHub Releases
        $msixUrl = "https://github.com/$repo/releases/download/$tag/$msixName"

        # Build .appinstaller XML — using XmlWriter to avoid string-escaping bugs
        $xmlPath = ".\release-artifacts\LodgeCore.appinstaller"
        $settings = New-Object System.Xml.XmlWriterSettings
        $settings.Indent = $true
        $settings.IndentChars = "  "
        $settings.Encoding = [System.Text.Encoding]::UTF8
        $settings.OmitXmlDeclaration = $false
        New-Item -ItemType Directory -Force -Path .\release-artifacts | Out-Null
        $writer = [System.Xml.XmlWriter]::Create($xmlPath, $settings)
        $writer.WriteStartDocument()
        $writer.WriteStartElement('AppInstaller', 'http://schemas.microsoft.com/appx/appinstaller/2018')
        $writer.WriteAttributeString('Uri', $appinstallerUrl)
        $writer.WriteAttributeString('Version', $version)
        # MainPackage
        $writer.WriteStartElement('MainPackage')
        $writer.WriteAttributeString('Name', 'com.lodgecore.frontdesk')
        $writer.WriteAttributeString('Version', $version)
        $writer.WriteAttributeString('Publisher', $env:CERT_SUBJECT)
        $writer.WriteAttributeString('Uri', $msixUrl)
        $writer.WriteAttributeString('ProcessorArchitecture', 'x86')
        $writer.WriteEndElement()
        # UpdateSettings
        $writer.WriteStartElement('UpdateSettings')
        $writer.WriteStartElement('OnLaunch')
        $writer.WriteAttributeString('HoursBetweenUpdateChecks', '1')
        $writer.WriteAttributeString('ShowPrompt', 'true')
        $writer.WriteAttributeString('UpdateBlocksActivation', 'true')
        $writer.WriteEndElement() # OnLaunch
        $writer.WriteElementString('AutomaticBackgroundTask', $null, $null)
        $writer.WriteElementString('ForceUpdateFromAnyVersion', 'true')
        $writer.WriteEndElement() # UpdateSettings
        $writer.WriteEndElement() # AppInstaller
        $writer.WriteEndDocument()
        $writer.Flush()
        $writer.Close()
        Write-Host "=== Generated .appinstaller ==="
        Get-Content $xmlPath

        # Fail before creating a release if the feed does not describe the
        # exact package produced by this build.
        [xml]$appInstallerXml = Get-Content $xmlPath -Raw
        $appInstallerNs = New-Object System.Xml.XmlNamespaceManager($appInstallerXml.NameTable)
        $appInstallerNs.AddNamespace('ai', 'http://schemas.microsoft.com/appx/appinstaller/2018')
        $mainPackage = $appInstallerXml.SelectSingleNode('/ai:AppInstaller/ai:MainPackage', $appInstallerNs)
        if (-not $mainPackage) { throw 'Generated AppInstaller has no MainPackage element' }
        if ($mainPackage.Name -ne 'com.lodgecore.frontdesk') { throw "Unexpected package name: $($mainPackage.Name)" }
        if ($mainPackage.Version -ne $version) { throw "AppInstaller version $($mainPackage.Version) does not match $version" }
        if ($mainPackage.Publisher -ne $env:CERT_SUBJECT) { throw 'AppInstaller publisher does not match the signing certificate' }
        if ($mainPackage.ProcessorArchitecture -ne 'x86') { throw 'AppInstaller architecture must be x86' }
        if (-not $mainPackage.Uri.EndsWith($msixName)) { throw "AppInstaller URI does not reference $msixName" }

    - name: Prepare Release Artifacts
      shell: powershell
      run: |
        # Copy MSIX to release-artifacts
        $msixFiles = Get-ChildItem -Path .\apps\desktop\LodgeCore.Desktop\bin -Recurse -Filter "*.msix" `
                     -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -notlike "*Dependencies*" }
        if ($msixFiles.Count -eq 0) {
          Write-Error "No .msix files found!"
          exit 1
        }
        $msixFiles | Copy-Item -Destination .\release-artifacts\ -Force
        Write-Host "=== Release artifacts ==="
        Get-ChildItem .\release-artifacts\

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          release-artifacts/*.msix
          release-artifacts/*.appinstaller
        generate_release_notes: true
        body: |
          ## Installation

          **First time install:** Download and open `LodgeCore.appinstaller`.
          > This registers Windows App Installer auto-updates. You will need to trust the LodgeCore certificate first.

          **Auto-update:** If installed through `LodgeCore.appinstaller`, Windows checks for updates on launch and in the background.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
