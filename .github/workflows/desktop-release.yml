name: Build and Release Desktop App
on:
  push:
    tags:
      - 'v*' # Trigger only when a new version tag is pushed (e.g., v1.0.1)
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI
jobs:
  build-desktop:
    runs-on: windows-latest
    permissions:
      contents: write   # Required to create GitHub Releases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup Node.js (for React frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install .NET MAUI Workloads
      run: dotnet workload install maui-windows
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8
    - name: Install Web Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Generate Prisma Types
      run: pnpm --filter @hotel-pms/db run db:generate
    - name: Build Web (Next.js Static Export)
      run: pnpm build:desktop
      env:
        NEXT_PUBLIC_IS_DESKTOP: "true"
    - name: Move Web Export to MAUI wwwroot
      run: |
        Remove-Item -Recurse -Force ./apps/desktop/LodgeCore.Desktop/wwwroot -ErrorAction Ignore
        Copy-Item -Path ./apps/web/out -Destination ./apps/desktop/LodgeCore.Desktop/wwwroot -Recurse
        
    - name: Create Self-Signed Certificate (for CI)
      id: create_cert
      shell: powershell
      run: |
        # Create self-signed cert and install it to CurrentUser\My store
        $cert = New-SelfSignedCertificate `
          -CertStoreLocation Cert:\CurrentUser\My `
          -DnsName "LodgeCore" `
          -Type CodeSigningCert `
          -Subject "CN=LodgeCore, O=LodgeCore, L=Lagos, S=Lagos, C=NG"

        # Capture the real subject as written by Windows (may be reordered)
        $subject = $cert.Subject
        $thumbprint = $cert.Thumbprint
        Write-Host "Certificate Subject: $subject"
        Write-Host "Certificate Thumbprint: $thumbprint"

        # Export PFX for reference (not used for signing below)
        New-Item -ItemType Directory -Force -Path .\apps\desktop\LodgeCore.Desktop\Certificates | Out-Null
        $pwd = ConvertTo-SecureString -String "lodgecore2026" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath .\apps\desktop\LodgeCore.Desktop\Certificates\LodgeCore.pfx -Password $pwd

        # Persist thumbprint to GITHUB_ENV so subsequent steps can read it
        echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

        # Prevent APPX0101 by syncing the manifest Publisher with the exact Windows-issued Subject
        $manifestPath = ".\apps\desktop\LodgeCore.Desktop\Platforms\Windows\Package.appxmanifest"
        (Get-Content $manifestPath) -replace 'Publisher="[^"]+"', "Publisher=`"$subject`"" | Set-Content $manifestPath
        Write-Host "Manifest Publisher updated to: $subject"

    - name: Publish MAUI Windows MSIX
      shell: powershell
      run: |
        # Use thumbprint-based signing (same as working build-desktop.yml)
        dotnet publish apps/desktop/LodgeCore.Desktop `
          -c Release `
          -f net10.0-windows10.0.19041.0 `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxPackageSigningEnabled=true `
          "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Prepare Release Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path .\release-artifacts | Out-Null
        # Search recursively so we are not tied to a specific RID (win-x86, win10-x86, etc.)
        $msixFiles = Get-ChildItem -Path .\apps\desktop\LodgeCore.Desktop\bin -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue
        $appinstallerFiles = Get-ChildItem -Path .\apps\desktop\LodgeCore.Desktop\bin -Recurse -Filter "*.appinstaller" -ErrorAction SilentlyContinue
        if ($msixFiles.Count -eq 0) {
          Write-Error "ERROR: No .msix files found! Check dotnet publish output above."
          exit 1
        }
        $msixFiles | Copy-Item -Destination .\release-artifacts\ -Force
        $appinstallerFiles | Copy-Item -Destination .\release-artifacts\ -Force
        Write-Host "=== Release artifacts ==="
        Get-ChildItem .\release-artifacts\
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release-artifacts/*.msix
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
