name: Build Desktop Installer (MSIX)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows MAUI App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Static Export
        run: pnpm build:desktop

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Decode Signing Certificate
        id: decode_cert
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath = "apps\desktop\LodgeCore.Desktop\LodgeCorePilot.pfx"
          [IO.File]::WriteAllBytes("$PWD\$certPath", $pfx_cert_byte)
          
          # Extract the thumbprint and install it to the local store
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import("$PWD\$certPath", $env:CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet)
          
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store([System.Security.Cryptography.X509Certificates.StoreName]::My, [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($cert)
          $store.Close()
          
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          # Export public .cer for artifact (so pilot sites can trust it)
          $publicCertPath = "LodgeCorePilot.cer"
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [IO.File]::WriteAllBytes("$PWD\$publicCertPath", $certBytes)

      - name: Build and Publish MSIX
        shell: powershell
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          cd apps\desktop\LodgeCore.Desktop
          dotnet publish -f net10.0-windows10.0.19041.0 -c Release /p:RuntimeIdentifierOverride=win10-x86 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint="${{ env.THUMBPRINT }}"

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LodgeCore-Windows-Installer
          path: |
            apps/desktop/LodgeCore.Desktop/bin/Release/net10.0-windows10.0.19041.0/win10-x86/AppPackages/**/*.msix
            LodgeCorePilot.cer
