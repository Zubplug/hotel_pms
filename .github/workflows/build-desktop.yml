name: Build Desktop Installer (MSIX)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows MAUI App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Decode Signing Certificate
        id: decode_cert
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath = "apps\desktop\LodgeCore.Desktop\LodgeCorePilot.pfx"
          [IO.File]::WriteAllBytes("$PWD\$certPath", $pfx_cert_byte)
          
          # Extract the thumbprint to pass to MSBuild
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import("$PWD\$certPath", $env:CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::MachineKeySet)
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          
          # Export public .cer for artifact (so pilot sites can trust it)
          $publicCertPath = "LodgeCorePilot.cer"
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [IO.File]::WriteAllBytes("$PWD\$publicCertPath", $certBytes)

      - name: Build and Publish MSIX
        shell: powershell
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          cd apps\desktop\LodgeCore.Desktop
          dotnet publish -f net8.0-windows10.0.19041.0 -c Release /p:RuntimeIdentifierOverride=win10-x86 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="LodgeCorePilot.pfx" /p:PackageCertificatePassword="$env:CERTIFICATE_PASSWORD" /p:PackageCertificateThumbprint="${{ env.THUMBPRINT }}"

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LodgeCore-Windows-Installer
          path: |
            apps/desktop/LodgeCore.Desktop/bin/Release/net8.0-windows10.0.19041.0/win-x86/AppPackages/**/*.msix
            LodgeCorePilot.cer
