name: Build Windows Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore apps/agent-windows/LodgeCore.LockAgent/LodgeCore.LockAgent.csproj

    - name: Build and Publish
      run: dotnet publish apps/agent-windows/LodgeCore.LockAgent/LodgeCore.LockAgent.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LodgeCore.LockAgent-win-x86
        path: ./publish/LodgeCore.LockAgent.exe
