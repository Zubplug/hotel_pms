name: Build Windows Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore hardware-agent/src/LodgeCore.HardwareAgent/LodgeCore.HardwareAgent.csproj

    - name: Build and Publish
      run: dotnet publish hardware-agent/src/LodgeCore.HardwareAgent/LodgeCore.HardwareAgent.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LodgeCore.HardwareAgent-win-x86
        path: ./publish/
