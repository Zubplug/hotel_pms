name: Deploy LodgeCore production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lodgecore-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, lodgecore-aws]

    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect affected services
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${GITHUB_EVENT_BEFORE:-}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=""
          fi

          if [[ -z "$BEFORE" ]]; then
            CHANGED="ALL"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          ALL=false
          PMS=false
          WEBSITE=false
          STANZEL=false

          if [[ "$CHANGED" == "ALL" ]]; then
            ALL=true
          elif printf '%s\n' "$CHANGED" | grep -Eq '^(packages/|pnpm-lock.yaml$|pnpm-workspace.yaml$|package.json$|deploy/|turbo.json$|\.dockerignore$)'; then
            ALL=true
          else
            printf '%s\n' "$CHANGED" | grep -q '^apps/web/' && PMS=true || true
            printf '%s\n' "$CHANGED" | grep -q '^apps/website/' && WEBSITE=true || true
            printf '%s\n' "$CHANGED" | grep -q '^apps/hotel-stanzel/' && STANZEL=true || true
          fi

          echo "all=$ALL" >> "$GITHUB_OUTPUT"
          echo "pms=$PMS" >> "$GITHUB_OUTPUT"
          echo "website=$WEBSITE" >> "$GITHUB_OUTPUT"
          echo "stanzel=$STANZEL" >> "$GITHUB_OUTPUT"

          if [[ "$ALL" == true ]]; then
            echo 'Deployment scope: all services'
          elif [[ "$PMS" == true || "$WEBSITE" == true || "$STANZEL" == true ]]; then
            echo "Deployment scope: PMS=$PMS website=$WEBSITE Stanzel=$STANZEL"
          else
            echo 'Deployment scope: no application service changes'
          fi

      - name: Sync source to production directory
        run: |
          sudo rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='deploy/.env.aws' \
            --exclude='deploy/nginx/conf.d/lodgecore.conf' \
            --exclude='.deploy/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='.next/' \
            --exclude='**/.next/' \
            --exclude='.pnpm-store/' \
            --exclude='**/.pnpm-store/' \
            ./ /opt/hotel_pms/

      - name: Install AWS scheduled jobs
        run: |
          set -euo pipefail
          cd /opt/hotel_pms
          sudo install -d -m 755 /opt/hotel_pms/deploy/cron /etc/systemd/system
          sudo chmod 755 deploy/cron/run-job.sh
          sudo install -m 644 deploy/systemd/*.service deploy/systemd/*.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl disable --now lodgecore-cron.service lodgecore-cron@.service 2>/dev/null || true
          for timer in \
            lodgecore-expire-booking-holds.timer \
            lodgecore-reconcile-refunds.timer \
            lodgecore-expire-demo-accounts.timer \
            lodgecore-expire-trials.timer \
            lodgecore-refund-escalation.timer \
            lodgecore-ota-reconciliation.timer; do
            sudo systemctl enable --now "$timer"
          done
          systemctl list-timers 'lodgecore-*' --all --no-pager

      - name: Build and restart production services
        env:
          BUILD_ALL: ${{ steps.changes.outputs.all }}
          BUILD_PMS: ${{ steps.changes.outputs.pms }}
          BUILD_WEBSITE: ${{ steps.changes.outputs.website }}
          BUILD_STANZEL: ${{ steps.changes.outputs.stanzel }}
        run: |
          set -euo pipefail
          cd /opt/hotel_pms
          COMPOSE="sudo docker compose --env-file deploy/.env.aws -f deploy/docker-compose.aws.yml"
          SERVICES=()

          if [[ "$BUILD_ALL" == true || "$BUILD_PMS" == true ]]; then SERVICES+=(pms); fi
          if [[ "$BUILD_ALL" == true || "$BUILD_WEBSITE" == true ]]; then SERVICES+=(website); fi
          if [[ "$BUILD_ALL" == true || "$BUILD_STANZEL" == true ]]; then SERVICES+=(stanzel); fi

          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo 'No application service changed; keeping running containers unchanged.'
            exit 0
          fi

          AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 {print $4}')"
          MINIMUM_FREE_KB=$((8 * 1024 * 1024))
          if (( AVAILABLE_KB < MINIMUM_FREE_KB )); then
            echo 'Low disk space detected; removing unused Docker build cache.'
            sudo docker builder prune -af
          fi

          echo "Building: ${SERVICES[*]}"
          $COMPOSE build "${SERVICES[@]}"
          $COMPOSE up -d --no-build --force-recreate "${SERVICES[@]}" nginx
          sudo docker exec deploy-nginx-1 nginx -t
          sudo docker exec deploy-nginx-1 nginx -s reload
          sleep 10
          $COMPOSE ps

      - name: Verify public HTTPS endpoints
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          check_identity() {
            local host="$1"
            local expected="$2"
            local response="$TMP_DIR/${host}.html"

            echo "Checking https://${host}/"
            curl --fail --silent --show-error --location \
              --resolve "${host}:443:127.0.0.1" \
              --max-time 30 \
              "https://${host}/" > "$response"

            if ! grep -Fq "$expected" "$response"; then
              echo "::error::${host} did not return the expected application identity: ${expected}"
              return 1
            fi

            echo "OK: ${host} (${expected})"
          }

          check_identity pms.zubplug.com.ng 'LodgeCore PMS'
          check_identity lodgecore.zubplug.com.ng 'LodgeCore'
          check_identity www.stanzelgrandresort.org 'Stanzel Grand Resort'
