name: Deploy LodgeCore production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lodgecore-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, lodgecore-aws]

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Sync source to production directory
        run: |
          sudo rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='deploy/.env.aws' \
            --exclude='deploy/nginx/conf.d/lodgecore.conf' \
            --exclude='.deploy/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='.next/' \
            --exclude='**/.next/' \
            --exclude='.pnpm-store/' \
            --exclude='**/.pnpm-store/' \
            ./ /opt/hotel_pms/

      - name: Build and restart production services
        run: |
          set -euo pipefail
          cd /opt/hotel_pms
          sudo docker builder prune -af
          sudo docker image prune -af
          COMPOSE="sudo docker compose --env-file deploy/.env.aws -f deploy/docker-compose.aws.yml"
          $COMPOSE build pms
          $COMPOSE build website
          $COMPOSE build stanzel
          $COMPOSE up -d --force-recreate pms website stanzel nginx
          sleep 10
          $COMPOSE ps
          sudo docker builder prune -af
          sudo docker image prune -af

      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --head https://pms.zubplug.com.ng/
          curl --fail --silent --show-error --head https://lodgecore.zubplug.com.ng/
          curl --fail --silent --show-error --head https://www.stanzelgrandresort.org/
