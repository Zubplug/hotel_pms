name: Deploy LodgeCore production

on:
  workflow_run:
    workflows: [Build and publish production images]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag to deploy
        required: true
        type: string

concurrency:
  group: lodgecore-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-north-1' }}.amazonaws.com

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64, lodgecore-aws]

    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Deploy immutable images
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"

          test -n "${AWS_ACCOUNT_ID:-${{ vars.AWS_ACCOUNT_ID }}}" || {
            echo 'AWS_ACCOUNT_ID repository variable is required.' >&2
            exit 1
          }
          test -n "$IMAGE_TAG" || {
            echo 'An immutable image tag is required.' >&2
            exit 1
          }

          # Only deployment manifests and scheduled-job definitions are copied
          # to production. Application source code is never built there.
          sudo rsync -az --delete \
            --exclude='.env.aws' \
            --exclude='nginx/conf.d/lodgecore.conf' \
            deploy/ /opt/hotel_pms/deploy/

          sudo install -d -m 755 /opt/hotel_pms/deploy/cron /etc/systemd/system
          sudo chmod 755 /opt/hotel_pms/deploy/cron/run-job.sh
          sudo install -m 644 /opt/hotel_pms/deploy/systemd/*.service /opt/hotel_pms/deploy/systemd/*.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          for timer in \
            lodgecore-expire-booking-holds.timer \
            lodgecore-reconcile-refunds.timer \
            lodgecore-expire-demo-accounts.timer \
            lodgecore-expire-trials.timer \
            lodgecore-refund-escalation.timer \
            lodgecore-ota-reconciliation.timer \
            lodgecore-commerce-scheduled-orders.timer \
            lodgecore-commerce-sync-watchdog.timer; do
            sudo systemctl enable --now "$timer"
          done

          cd /opt/hotel_pms
          export PMS_IMAGE="$ECR_REGISTRY/lodgecore-pms:$IMAGE_TAG"
          export WEBSITE_IMAGE="$ECR_REGISTRY/lodgecore-website:$IMAGE_TAG"
          export STANZEL_IMAGE="$ECR_REGISTRY/lodgecore-stanzel:$IMAGE_TAG"
          PREVIOUS_TAG="$(sudo cat deploy/.last-successful-image-tag 2>/dev/null || true)"

          # The deploy host is a long-lived self-hosted runner. Remove only
          # old release images before pulling the next immutable release. Keep
          # the current and previous release so rollback remains available;
          # running containers and volumes are preserved.
          sudo docker container prune --force
          for repository in lodgecore-pms lodgecore-website lodgecore-stanzel; do
            while read -r image_tag; do
              [[ -z "$image_tag" || "$image_tag" == '<none>' ]] && continue
              [[ "$image_tag" == "$IMAGE_TAG" || ( -n "$PREVIOUS_TAG" && "$image_tag" == "$PREVIOUS_TAG" ) ]] && continue
              sudo docker image rm "$ECR_REGISTRY/$repository:$image_tag" || true
            done < <(sudo docker image ls "$ECR_REGISTRY/$repository" --format '{{.Tag}}')
          done
          sudo docker image prune --force
          sudo docker builder prune --all --force --filter 'until=168h' || true
          sudo journalctl --vacuum-size=500M || true

          compose() {
            sudo env \
              PMS_IMAGE="$PMS_IMAGE" \
              WEBSITE_IMAGE="$WEBSITE_IMAGE" \
              STANZEL_IMAGE="$STANZEL_IMAGE" \
              docker compose --env-file deploy/.env.aws -f deploy/docker-compose.aws.yml "$@"
          }

          rollback() {
            if [[ -z "$PREVIOUS_TAG" ]]; then
              echo 'No previous image tag is recorded; leaving failed deployment stopped.' >&2
              return
            fi
            echo "Rolling back to $PREVIOUS_TAG"
            export PMS_IMAGE="$ECR_REGISTRY/lodgecore-pms:$PREVIOUS_TAG"
            export WEBSITE_IMAGE="$ECR_REGISTRY/lodgecore-website:$PREVIOUS_TAG"
            export STANZEL_IMAGE="$ECR_REGISTRY/lodgecore-stanzel:$PREVIOUS_TAG"
            compose up -d --no-build --force-recreate pms website stanzel nginx || true
          }
          trap 'rollback' ERR

          aws ecr get-login-password --region "$AWS_REGION" |
            sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"
          compose pull pms website stanzel nginx
          compose up -d --no-build --force-recreate pms website stanzel nginx
          sudo docker exec deploy-nginx-1 nginx -t
          sudo docker exec deploy-nginx-1 nginx -s reload
          sleep 10

          check_identity() {
            local host="$1"
            local expected="$2"
            local body
            local status
            body="$(mktemp)"
            if ! curl --fail --silent --show-error --location \
              --resolve "${host}:443:127.0.0.1" --max-time 30 \
              "https://${host}/" -o "$body"; then
              rm -f "$body"
              return 1
            fi
            grep -Fq "$expected" "$body"
            status=$?
            rm -f "$body"
            return "$status"
          }
          check_identity pms.zubplug.com.ng 'LodgeCore PMS'
          check_identity lodgecore.zubplug.com.ng 'LodgeCore'
          check_identity www.stanzelgrandresort.org 'Stanzel Grand Resort'

          printf '%s\n' "$IMAGE_TAG" | sudo tee deploy/.last-successful-image-tag >/dev/null
          trap - ERR
          compose ps
