name: Deploy LodgeCore production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lodgecore-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AWS_SSH_KEY" > "$HOME/.ssh/lodgecore_deploy"
          chmod 600 "$HOME/.ssh/lodgecore_deploy"
          ssh-keyscan -H "$AWS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync source to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='deploy/.env.aws' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='.next/' \
            --exclude='**/.next/' \
            --exclude='.pnpm-store/' \
            --exclude='**/.pnpm-store/' \
            -e "ssh -i $HOME/.ssh/lodgecore_deploy" \
            ./ "$AWS_USER@$AWS_HOST:$AWS_APP_DIR/"

      - name: Build and restart production services
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          ssh -i "$HOME/.ssh/lodgecore_deploy" "$AWS_USER@$AWS_HOST" <<EOF
          set -euo pipefail
          cd "$AWS_APP_DIR"
          COMPOSE="sudo docker compose --env-file deploy/.env.aws -f deploy/docker-compose.aws.yml"
          $COMPOSE build pms
          $COMPOSE build website
          $COMPOSE build stanzel
          $COMPOSE up -d --force-recreate pms website stanzel nginx
          sleep 10
          $COMPOSE ps
          sudo docker builder prune -af
          EOF

      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --head https://pms.zubplug.com.ng/
          curl --fail --silent --show-error --head https://lodgecore.zubplug.com.ng/
          curl --fail --silent --show-error --head https://www.stanzelgrandresort.org/
