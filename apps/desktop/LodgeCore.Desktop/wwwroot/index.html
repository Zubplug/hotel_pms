<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LodgeCore Desktop</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f4f5; }
        #app { display: flex; flex-direction: column; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .loading { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; font-family: system-ui, sans-serif; color: #512bd4; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #512bd4; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <h2>Starting LodgeCore Offline Engine...</h2>
        </div>
    </div>

    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
