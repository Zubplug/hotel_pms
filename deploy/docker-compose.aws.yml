services:
  pms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.next
      args:
        APP: web
        AUTH_SECRET: ${AUTH_SECRET}
    env_file:
      - .env.aws
    environment:
      PORT: 3000
      # PMS owns the web session. Keep its public origin and legacy secret
      # alias aligned with the canonical Auth.js secret.
      NEXT_PUBLIC_SITE_URL: https://pms.zubplug.com.ng
      NEXTAUTH_URL: https://pms.zubplug.com.ng
      NEXTAUTH_SECRET: ${AUTH_SECRET}
    restart: unless-stopped
    expose:
      - "3000"
    logging: &lodgecore_logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  website:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.next
      args:
        APP: website
        AUTH_SECRET: ${AUTH_SECRET}
    env_file:
      - .env.aws
    environment:
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: https://lodgecore.zubplug.com.ng
      # The customer portal is served by this container. Do not inherit the
      # PMS hostname from the shared env file, or Auth.js will send portal
      # login, callback, and logout URLs to the PMS service.
      NEXTAUTH_URL: https://lodgecore.zubplug.com.ng
      NEXTAUTH_SECRET: ${AUTH_SECRET}
    restart: unless-stopped
    expose:
      - "3000"
    logging: *lodgecore_logging

  stanzel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.next
      args:
        APP: hotel-stanzel
        AUTH_SECRET: ${AUTH_SECRET}
    env_file:
      - .env.aws
    environment:
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: https://www.stanzelgrandresort.org
      PUBLIC_SITE_ORIGIN: https://www.stanzelgrandresort.org
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      # Stanzel calls the public booking and corporate APIs server-to-server.
      # Keep these on the private Compose network so they cannot accidentally
      # route through the PMS hostname or depend on public DNS.
      LC_API_URL: http://website:3000/api/v1/public
      CORPORATE_API_URL: http://website:3000
    restart: unless-stopped
    expose:
      - "3000"
    logging: *lodgecore_logging

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - pms
      - website
      - stanzel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    logging: *lodgecore_logging
