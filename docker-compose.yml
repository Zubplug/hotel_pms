version: '3.8'

services:
  db:
    image: postgres:16
    container_name: hotel_pms_db
    environment:
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_password
      POSTGRES_DB: hotel_pms
    ports:
      - "5433:5432"
    volumes:
      - pms_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hotel_pms_redis
    ports:
      - "6379:6379"
    volumes:
      - pms_redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lodgecore.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pms_db_data:
  pms_redis_data:
